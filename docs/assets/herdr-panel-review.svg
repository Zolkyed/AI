<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Herdr Panel multi-agent review</title>
  <desc id="desc">Panel creates Herdr panes, launches supported coding agents, and combines their evidence into one review.</desc>
  <defs>
    <style>
      .bg { fill: #071521; }
      .primary { fill: #172554; stroke: #60a5fa; stroke-width: 3; }
      .panel { fill: #3b1d5a; stroke: #c084fc; stroke-width: 3; }
      .agent { fill: #172033; stroke: #64748b; stroke-width: 2; }
      .result { fill: #12372a; stroke: #4ade80; stroke-width: 3; }
      .title { fill: #f8fafc; font: 700 30px system-ui, sans-serif; text-anchor: middle; }
      .label { fill: #f8fafc; font: 700 19px system-ui, sans-serif; text-anchor: middle; }
      .small { fill: #cbd5e1; font: 15px system-ui, sans-serif; text-anchor: middle; }
      .arrow { fill: none; stroke: #94a3b8; stroke-width: 3; marker-end: url(#head); }
      .branch { fill: none; stroke: #64748b; stroke-width: 2; }
    </style>
    <marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8" />
    </marker>
  </defs>
  <rect class="bg" width="1400" height="620" rx="24" />
  <text class="title" x="700" y="52">/panel — Agent-Agnostic Review Through Herdr</text>

  <rect class="primary" x="80" y="235" width="210" height="120" rx="18" />
  <text class="label" x="185" y="278">Primary Agent</text>
  <text class="small" x="185" y="310">Already inside Herdr</text>
  <text class="small" x="185" y="335">any supported kind</text>

  <rect class="panel" x="360" y="235" width="220" height="120" rx="18" />
  <text class="label" x="470" y="278">Panel</text>
  <text class="small" x="470" y="310">Creates its own panes</text>
  <text class="small" x="470" y="335">assigns review roles</text>

  <path class="arrow" d="M290 295 H350" />
  <path class="branch" d="M580 295 H650 M650 125 V465" />

  <rect class="agent" x="700" y="80" width="210" height="90" rx="16" />
  <text class="label" x="805" y="116">Claude</text>
  <text class="small" x="805" y="145">specification review</text>
  <path class="arrow" d="M650 125 H690" />

  <rect class="agent" x="700" y="195" width="210" height="90" rx="16" />
  <text class="label" x="805" y="231">Codex</text>
  <text class="small" x="805" y="260">standards review</text>
  <path class="arrow" d="M650 240 H690" />

  <rect class="agent" x="700" y="310" width="210" height="90" rx="16" />
  <text class="label" x="805" y="346">Copilot</text>
  <text class="small" x="805" y="375">verification evidence</text>
  <path class="arrow" d="M650 355 H690" />

  <rect class="agent" x="700" y="425" width="210" height="90" rx="16" />
  <text class="label" x="805" y="461">OpenCode + others</text>
  <text class="small" x="805" y="490">Herdr-discovered kinds</text>
  <path class="arrow" d="M650 470 H690" />

  <path class="branch" d="M910 125 H965 M910 240 H965 M910 355 H965 M910 470 H965 M965 125 V470" />
  <path class="arrow" d="M965 295 H1015" />

  <rect class="result" x="1025" y="235" width="290" height="120" rx="18" />
  <text class="label" x="1170" y="275">One Validated Review</text>
  <text class="small" x="1170" y="307">Deduplicate • verify evidence</text>
  <text class="small" x="1170" y="332">fix findings • re-review</text>

  <text class="small" x="700" y="570">Agent availability and authentication are discovered at runtime; Panel never assumes one provider</text>
</svg>
