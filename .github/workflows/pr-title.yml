name: PR Title

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions: {}

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
